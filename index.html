

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        ()=>{

            navigator.serviceWorker
                .register("./service-worker.js")
                .then(
                    ()=>{
                        console.log(
                            "Lingo Pro PWA готова"
                        );
                    }
                )
                .catch(
                    error=>{
                        console.error(
                            "PWA ошибка:",
                            error
                        );
                    }
                );

        }
    );

}

</script>

</body>
</html>
